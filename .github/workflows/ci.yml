name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.4.10

      - name: Run ruff
        run: ruff check .

  test:
    name: Tests (CPU)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v

  config-validate:
    name: Validate configs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Parse all YAML + DeepSpeed JSON configs
        run: |
          python - <<'EOF'
          import yaml, json, sys, pathlib
          errors = []
          for p in pathlib.Path("configs").rglob("*.yaml"):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  errors.append(f"{p}: {e}")
          for p in pathlib.Path("configs/deepspeed").glob("*.json"):
              try:
                  json.loads(p.read_text())
              except json.JSONDecodeError as e:
                  errors.append(f"{p}: {e}")
          if errors:
              [print(e) for e in errors]
              sys.exit(1)
          print("All configs valid.")
          EOF
