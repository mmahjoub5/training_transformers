[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-transformers"
version = "0.1.0"
description = "LLM fine-tuning framework with Socratic teaching focus (HF Transformers + PEFT + TRL)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Amin Mahjoub" }]
dependencies = [
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "datasets>=2.18",
    "torch>=2.1",
    "accelerate>=0.27",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
deepspeed = ["deepspeed>=0.14"]
wandb = ["wandb>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
lora-train = "scripts.lora_train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
exclude = ["tests*", "benchmarks*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["scripts/test/", "benchmarks/", "1-6-remotate-training/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
