model:
  name: microsoft/Phi-3.5-mini-instruct
  adapter: /home/ubuntu/training_transformers/checkpoints/checkpoint-1750
  kind: clm
  attn_implementation: sdpa
  
data:
  name: json
  data_file: data/custom_dataset/fix_infinte.json  # Update path if needed
  split: null
  config_name: null
  train_split: train
  val_split: validation
  test_split: null
  max_train_samples: null
  max_val_samples: null
  shuffle_train: true
  seed: 42
  preprocessor: SocraticPreprocessor

tokenizer:
  max_length: 4096  # Short examples for focused EOS training

training:
  batch_size: 8
  gradient_accumulation_steps: 4   # effective batch 32
  max_steps: 80                    # ~80 optimizer updates is plenty for EOS
  lr: 1.0e-4                       # or 5e-5 if you're cautious
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  output_dir: output/eos_fix/phi35/
  evaluation_strategy: steps
  eval_steps: 20
  gradient_checkpointing: true
  bf16: true
  epochs: 10

logging:
  report_to: tensorboard
  logging_dir: "./runs/eos_fix"
  logging_steps: 5
  save_steps: 20
  level: info
  save_strategy: steps

lora:
  rank: 8  # Lower rank for targeted fix
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
